plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.ksp)
}

// NewsAPI key comes from gradle.properties (or the command line via -P).
// See gradle.properties and docs/SETUP.md for instructions.
def newsApiKey = (project.findProperty("NEWS_API_KEY") ?: "YOUR_NEWSAPI_KEY_HERE").toString()

android {
    namespace 'com.rtctek.newsapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.rtctek.newsapp"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "2.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField("String", "API_KEY", "\"$newsApiKey\"")
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Java 8+ API desugaring (java.time on API < 26)
    coreLibraryDesugaring libs.desugar

    // AndroidX UI
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.androidx.material
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.viewpager2
    implementation libs.androidx.fragment.ktx
    implementation libs.androidx.activity.ktx
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.androidx.lifecycle.livedata.ktx
    implementation libs.androidx.swiperefreshlayout

    // Room (offline cache + saved news)
    implementation libs.androidx.room.runtime
    implementation libs.androidx.room.ktx
    ksp libs.room.compiler

    // Networking
    implementation libs.retrofit
    implementation libs.retrofit.gson
    implementation libs.okhttp
    implementation libs.okhttp.logging

    // Coroutines
    implementation libs.coroutines.core
    implementation libs.coroutines.android

    // Image loading
    implementation libs.coil
    implementation libs.shimmer

    // Testing
    testImplementation libs.junit
    testImplementation libs.mockwebserver
    // Real org.json for JVM unit tests (the android.jar stub throws "not mocked")
    testImplementation 'org.json:json:20240303'
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.espresso.core
}
