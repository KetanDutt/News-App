name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # Optional: add NEWS_API_KEY as a repository secret for a fully
      # functional build artifact. Without it the app builds fine and
      # simply shows the placeholder-key error screen at runtime.
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
        env:
          ORG_GRADLE_PROJECT_NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
        env:
          ORG_GRADLE_PROJECT_NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
