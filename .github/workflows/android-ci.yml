name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # Optional: add NEWS_API_KEY as a repository secret for a fully
      # functional build artifact. Without it the app builds fine and
      # simply shows the placeholder-key error screen at runtime.
      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build.log
        env:
          ORG_GRADLE_PROJECT_NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee test.log
        env:
          ORG_GRADLE_PROJECT_NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}

      # Diagnostics: surface the relevant Gradle error excerpt as a PR
      # comment so failures are actionable without downloading artifacts.
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LOG="build.log"
          [ -f "$LOG" ] || LOG="test.log"
          {
            echo "### ❌ CI failed on \`${{ github.sha }}\`"
            echo '```text'
            grep -nE "^[eE]: |error:|FAILURE:|What went wrong|Caused by:|Could not|Execution failed" -A 8 "$LOG" | head -150
            echo '```'
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md

      - name: Upload debug APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
